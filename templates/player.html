<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ channel_name }} — IPTV Player</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0d0d0d;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
      }
      .top-bar {
        width: 100%;
        max-width: 960px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .top-bar a {
        color: #aaa;
        text-decoration: none;
        font-size: 13px;
      }
      .top-bar a:hover {
        color: #fff;
      }
      .top-bar h1 {
        font-size: 17px;
        font-weight: 600;
        color: #fff;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ch-badge {
        background: #667eea;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 12px;
        flex-shrink: 0;
      }
      .video-wrap {
        width: 100%;
        max-width: 960px;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        aspect-ratio: 16/9;
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
      }
      .status {
        width: 100%;
        max-width: 960px;
        margin-top: 10px;
        font-size: 12px;
        color: #888;
        min-height: 18px;
      }
      .status.error {
        color: #e74c3c;
      }
      .status.ok {
        color: #2ecc71;
      }
      .actions {
        width: 100%;
        max-width: 960px;
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .btn {
        padding: 9px 18px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .btn-vlc {
        background: #e8650a;
        color: #fff;
      }
      .btn-iina {
        background: #1a1a2e;
        color: #fff;
      }
      .btn-back {
        background: #333;
        color: #ddd;
      }
      .btn:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <a href="/channels">← Channels</a>
      <span class="ch-badge">{{ channel_number }}</span>
      <h1>{{ channel_name }}</h1>
    </div>

    <div class="video-wrap">
      <video id="video" controls autoplay playsinline></video>
    </div>

    <div class="status" id="status">Loading stream…</div>

    <div class="actions">
      <a class="btn btn-vlc" href="{{ vlc_href }}">Open in VLC</a>
      <a class="btn btn-iina" href="iina://open?url={{ stream_url_encoded }}"
        >Open in IINA</a
      >
      <a class="btn btn-back" href="/channels">← Back to Channels</a>
    </div>

    <!-- mpegts.js: plays raw MPEG-TS streams (video/mp2t) via MSE -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.min.js"></script>
    <script>
      const streamUrl = {{ stream_url_json | safe }};
      const video = document.getElementById('video');
      const status = document.getElementById('status');

      function setStatus(msg, cls) {
        status.textContent = msg;
        status.className = 'status' + (cls ? ' ' + cls : '');
      }

      // MP4 files play natively; mpegts.js is only for MPEG-TS / live streams.
      // Route MP4s through the local proxy so CORS / provider restrictions don't block playback.
      const urlPath = streamUrl.split('?')[0].toLowerCase();
      const isMp4 = urlPath.endsWith('.mp4') || urlPath.endsWith('.m4v');

      if (isMp4) {
        video.src = '/api/proxy_url?url=' + encodeURIComponent(streamUrl);
        video.addEventListener('canplay', () => {
          setStatus('Stream loaded — playing', 'ok');
          video.play().catch(() => {});
        });
        video.addEventListener('waiting', () => setStatus('Buffering…'));
        video.addEventListener('playing', () => setStatus('Playing', 'ok'));
        video.addEventListener('error', () => {
          const err = video.error;
          setStatus('Stream error: ' + (err ? err.message : 'unknown') + '. Try VLC or IINA below.', 'error');
        });
      } else if (mpegts.getFeatureList().mseLivePlayback) {
        // A dropped/failed connection is often transient (brief upstream hiccup) —
        // auto-reconnect a bounded number of times before giving up, the way the
        // server-side proxy paths already do, instead of dead-ending on the first error.
        const MAX_RETRIES = 3;
        const RETRY_DELAY_MS = 1500;
        let retryCount = 0;
        let player = null;

        function destroyPlayer() {
          if (!player) return;
          try { player.unload(); } catch (e) {}
          try { player.detachMediaElement(); } catch (e) {}
          try { player.destroy(); } catch (e) {}
          player = null;
        }

        function startPlayer() {
          destroyPlayer();
          player = mpegts.createPlayer({
            type: 'mpegts',
            isLive: true,
            url: streamUrl,
          }, {
            enableWorker: true,
            enableStashBuffer: true,
            stashInitialSize: {{ stash_kb }},
            // Correct live latency drift by gently speeding up playback (imperceptible),
            // not by hard-seeking — liveBufferLatencyChasing's hard seek caused repeated,
            // disruptive rebuffering every time it tripped instead of a smooth correction.
            liveSync: true,
            liveSyncMaxLatency: {{ latency_max }},
            liveSyncTargetLatency: {{ latency_min }},
            lazyLoadMaxDuration: 60,
            deferLoadAfterSourceOpen: false,
          });
          player.attachMediaElement(video);
          player.on(mpegts.Events.ERROR, (errorType, errorDetail, errorInfo) => {
            if (retryCount < MAX_RETRIES) {
              retryCount += 1;
              setStatus(`Stream error: ${errorDetail} — reconnecting (${retryCount}/${MAX_RETRIES})…`);
              setTimeout(startPlayer, RETRY_DELAY_MS);
            } else {
              setStatus('Stream error: ' + errorDetail + '. Try VLC or IINA below.', 'error');
            }
          });
          player.load();
        }

        video.addEventListener('canplay', () => {
          retryCount = 0;  // played successfully — reset the retry budget
          setStatus('Stream loaded — playing', 'ok');
          video.play().catch(() => {});
        });
        video.addEventListener('waiting', () => setStatus('Buffering…'));
        video.addEventListener('playing', () => setStatus('Playing', 'ok'));

        startPlayer();
      } else {
        setStatus('Your browser does not support MSE playback. Use VLC or IINA below.', 'error');
      }
    </script>
  </body>
</html>

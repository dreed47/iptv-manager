<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}IPTV Manager{% endblock %}</title>
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    :root {
      --primary:        #2563eb;
      --primary-hover:  #1d4ed8;
      --success:        #16a34a;
      --success-hover:  #15803d;
      --danger:         #dc2626;
      --danger-hover:   #b91c1c;
      --warning:        #d97706;
      --warning-hover:  #b45309;
      --text:           #1e293b;
      --text-muted:     #64748b;
      --border:         #e2e8f0;
      --surface:        #ffffff;
      --bg:             #f1f5f9;
      --sidebar-bg:     #0f172a;
      --radius:         8px;
      --shadow:         0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    }

    html.dark {
      --text:       #f1f5f9;
      --text-muted: #94a3b8;
      --border:     #334155;
      --surface:    #1e293b;
      --bg:         #0f172a;
      --sidebar-bg: #020617;
      --shadow:     0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    }

    html.dark .badge-success { background: #14532d; color: #86efac; }
    html.dark .badge-danger  { background: #7f1d1d; color: #fca5a5; }
    html.dark .badge-warning { background: #78350f; color: #fcd34d; }
    html.dark .badge-neutral { background: #1e293b; color: #94a3b8; }

    html.dark .form-input,
    html.dark .form-select,
    html.dark .form-textarea {
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Slim top-bar ─────────────────────────────── */
    .slim-topbar {
      background: var(--sidebar-bg);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 48px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .slim-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .slim-back:hover { background: rgba(255,255,255,0.07); color: #e2e8f0; }

    .slim-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slim-spacer { flex: 1; }

    .slim-dark-toggle {
      background: none;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 15px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .slim-dark-toggle:hover { background: rgba(255,255,255,0.07); color: #e2e8f0; }

    /* ── Page content ─────────────────────────────── */
    .slim-content {
      flex: 1;
      padding: 24px 20px;
    }

    /* ── Buttons ─────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary  { background: var(--primary);  color: #fff; }
    .btn-primary:hover:not(:disabled)  { background: var(--primary-hover); }
    .btn-success  { background: var(--success);  color: #fff; }
    .btn-success:hover:not(:disabled)  { background: var(--success-hover); }
    .btn-warning  { background: var(--warning);  color: #fff; }
    .btn-warning:hover:not(:disabled)  { background: var(--warning-hover); }
    .btn-danger   { background: var(--danger);   color: #fff; }
    .btn-danger:hover:not(:disabled)   { background: var(--danger-hover); }
    .btn-secondary { background: #94a3b8; color: #fff; }
    .btn-secondary:hover:not(:disabled) { background: #7b93a8; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover:not(:disabled) { background: var(--bg); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ── Cards ───────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
    }

    /* ── Forms ───────────────────────────────────── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .form-select { width: auto; cursor: pointer; }

    /* ── Badges ──────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      letter-spacing: 0.1px;
    }
    .badge-success { background: #dcfce7; color: #15803d; }
    .badge-danger  { background: #fee2e2; color: #dc2626; }
    .badge-warning { background: #fef3c7; color: #b45309; }
    .badge-neutral { background: #f1f5f9; color: #64748b; }

    /* ── Mono box ────────────────────────────────── */
    .mono-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 12px;
      color: var(--text);
      word-break: break-all;
    }

    /* ── Layout helpers ──────────────────────────── */
    .flex         { display: flex; }
    .flex-center  { display: flex; align-items: center; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .flex-wrap    { flex-wrap: wrap; }
    .gap-6  { gap: 6px; }
    .gap-8  { gap: 8px; }
    .gap-12 { gap: 12px; }
    .gap-16 { gap: 16px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .text-muted { color: var(--text-muted); }
    .text-sm    { font-size: 12px; }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <nav class="slim-topbar">
    {% block back_link %}<a href="/" class="slim-back">← Back</a>{% endblock %}
    <span class="slim-title">{% block page_title %}IPTV Manager{% endblock %}</span>
    <div class="slim-spacer"></div>
    <button class="slim-dark-toggle" onclick="toggleDarkMode()" id="darkToggle" title="Toggle dark mode">
      <span id="darkToggleIcon">🌙</span>
    </button>
  </nav>

  <div class="slim-content">
    {% block content %}{% endblock %}
  </div>

  <script>
    function _syncDarkToggle(isDark) {
      var icon = document.getElementById('darkToggleIcon');
      if (icon) icon.textContent = isDark ? '☀️' : '🌙';
    }

    function toggleDarkMode() {
      var isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      _syncDarkToggle(isDark);
    }

    function _fallbackCopyText(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = String(text);
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.left = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return !!ok;
      } catch (e) {
        return false;
      }
    }

    function _copyFeedback(el) {
      if (!el) return;
      var tag = (el.tagName || '').toLowerCase();
      if (tag === 'svg' || tag === 'path') {
        var origColor = el.style.color;
        el.style.color = 'var(--success, #16a34a)';
        setTimeout(function() { el.style.color = origColor; }, 1500);
        return;
      }
      var orig = el.textContent;
      el.textContent = 'Copied!';
      setTimeout(function() { el.textContent = orig; }, 2000);
    }

    function copyToClipboard(text, el) {
      // navigator.clipboard requires a secure context (https or localhost). On LAN http
      // it will fail, so we fall back to execCommand.
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(String(text)).then(function() {
          _copyFeedback(el);
        }).catch(function() {
          if (_fallbackCopyText(text)) _copyFeedback(el);
        });
        return;
      }

      if (_fallbackCopyText(text)) _copyFeedback(el);
    }

    document.addEventListener('DOMContentLoaded', function() {
      _syncDarkToggle(document.documentElement.classList.contains('dark'));
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>

services:
  app:
    build: .
    container_name: ${CONTAINER_NAME:-iptv-app}
    env_file:
      - .env
    ports:
      - "${APP_PORT:-5005}:5005"
    # To see real client IPs instead of the Docker bridge gateway, run the app
    # directly on the host (no Docker) or use network_mode: host on Linux.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./m3u_files:/app/m3u_files
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-512m}
          cpus: '${CPU_LIMIT:-1.0}'
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_search: []
    extra_hosts:
      - "host.docker.internal:host-gateway"

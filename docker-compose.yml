services:
  app:
    build: .
    container_name: ${CONTAINER_NAME:-iptv-app}
    environment:
      - HDHR_ADVERTISE_HOST=${HDHR_ADVERTISE_HOST}
      - HDHR_ADVERTISE_PORT=${APP_PORT}
      - HDHR_SCHEME=${HDHR_SCHEME}
      - HDHR_MODEL=${HDHR_MODEL:-HDHR3-US}
      - HDHR_FRIENDLY_NAME=${HDHR_FRIENDLY_NAME:-IPTV HDHomeRun}
      - HDHR_TUNER_COUNT=${HDHR_TUNER_COUNT:-2}
      - HDHR_DISABLE_SSDP=${HDHR_DISABLE_SSDP:-1}
      - ALLOW_FULL_M3U_DOWNLOAD=${ALLOW_FULL_M3U_DOWNLOAD:-1}
      - IPTV_USERNAME=${IPTV_USERNAME:-iptv}
      - IPTV_PASSWORD=${IPTV_PASSWORD:-iptv}
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - TZ=${TZ:-UTC}
    ports:
      - "${APP_PORT:-5005}:5005"
    # To see real client IPs instead of the Docker bridge gateway, run the app
    # directly on the host (no Docker) or use network_mode: host on Linux.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./m3u_files:/app/m3u_files
      - ./data:/app/data
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_search: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
